<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitor de Dominios - OPT MEDIA LATAM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="logo-area">
      <img src="https://optmedialatam.com/wp-content/uploads/2024/01/LOGO-OPTMEDIA-300x132-1.webp"
           alt="OPT MEDIA LATAM" class="logo">
      <h1>Monitor de Dominios</h1>
    </div>
    <nav>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('index') }}">Inicio</a>
        <a href="{{ url_for('register') }}">Registrar Dominio</a>
        {% if current_user.is_admin %}
          <a href="{{ url_for('admin_users') }}">Usuarios</a>
          <a href="{{ url_for('admin_settings') }}">Configuración</a>
        {% endif %}
        <a href="{{ url_for('logout') }}" style="border-color: var(--red); color: var(--red);">Cerrar sesión</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>2025 OPT MEDIA LATAM · Todos los derechos reservados</p>
  </footer>
</body>
</html>
